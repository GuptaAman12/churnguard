{{- if and .Values.secrets.apiKey (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "churnguard.secretName" . }}
  labels:
    {{- include "churnguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  CHURNGUARD_API_KEY: {{ .Values.secrets.apiKey | quote }}
{{- end }}
