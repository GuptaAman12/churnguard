replicaCount: 2

image:
  repository: ghcr.io/guptaaman12/churnguard-api
  tag: "0.2.1"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # The image ships no fixed uid, so anything above 10000 avoids colliding with
  # host users. Writable paths are the emptyDir mounts declared below.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The API writes prediction logs and needs a scratch dir; everything else in the
# image is read-only.
writablePaths:
  - name: logs
    mountPath: /app/logs
  - name: tmp
    mountPath: /tmp

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: churnguard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 24

env:
  CHURNGUARD_TRACKING_URI: http://mlflow.ml-platform.svc.cluster.local:5000
  CHURNGUARD_ENV: production
  CHURNGUARD_LOG_LEVEL: INFO
  CHURNGUARD_LOG_JSON: "true"
  CHURNGUARD_MODEL_REFRESH_SECONDS: "60"
  CHURNGUARD_DRIFT_SHARE_THRESHOLD: "0.3"
  CHURNGUARD_PUSHGATEWAY_URL: http://prometheus-pushgateway.monitoring.svc.cluster.local:9091

secrets:
  # When set, the chart creates a Secret and the API requires X-API-Key.
  apiKey: ""
# Or reference an externally managed secret containing CHURNGUARD_API_KEY.
existingSecret: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: churnguard

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: churnguard

networkPolicy:
  enabled: true
  # No `from` clause: any ingress controller, load balancer or scraper may reach
  # the API port. Narrow this with namespace/pod selectors in your own values.
  ingress:
    - ports:
        - port: http
          protocol: TCP
  # DNS everywhere, plus the tracking server and Pushgateway the API talks to.
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5000
          protocol: TCP
        - port: 9091
          protocol: TCP
