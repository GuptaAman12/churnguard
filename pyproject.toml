[project]
name = "churnguard"
version = "0.2.0"
description = "Production-grade MLOps platform for customer churn prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ChurnGuard Team" }]
keywords = ["mlops", "machine-learning", "churn", "mlflow", "prefect", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "fastapi>=0.139,<0.151",
  "httpx>=0.27",
  "joblib>=1.4",
  "mlflow>=2.16,<4",
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.20",
  "prometheus-client>=0.20",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "structlog>=24.1",
  "uvicorn[standard]>=0.30",
  "xgboost>=2.1",
]

[dependency-groups]
# Installed by the pipeline/worker image only (training + orchestration + drift).
pipeline = [
  "boto3>=1.35",
  "dvc[s3]>=3.50",
  "evidently>=0.6",
  "optuna>=4.0",
  "prefect>=3.9,<4",
]
# Installed by the MLflow server image only.
mlflow = [
  "boto3>=1.35",
  "psycopg2-binary>=2.9",
]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
churnguard = "churnguard.cli:main"

[project.urls]
Homepage = "https://github.com/GuptaAman12/churnguard"
Documentation = "https://github.com/GuptaAman12/churnguard#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# sklearn's estimator API intentionally uses X.
"src/churnguard/modeling/calibration.py" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv", "^dvc", "^mlruns"]

[[tool.mypy.overrides]]
module = [
  "mlflow.*",
  "evidently.*",
  "dvc.*",
  "prefect.*",
  "optuna.*",
  "joblib.*",
  "xgboost.*",
  "sklearn.*",
  "scipy.*",
  "pandera.*",
  "prometheus_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=churnguard --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
markers = [
  "integration: tests that need external services (MLflow, network, Docker)",
  "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning:evidently.*"]

[tool.coverage.run]
source = ["src/churnguard"]
branch = true
omit = ["*/cli.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
