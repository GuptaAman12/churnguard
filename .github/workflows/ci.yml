name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - name: Export locked requirements
        run: uv export --format requirements-txt --no-hashes --all-groups > requirements.txt
      - name: pip-audit
        run: |
          uv tool run pip-audit -r requirements.txt --strict --ignore-vuln GHSA-4xh5-x5gv-qwph || true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: false
          tags: churnguard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MLflow image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mlflow
          push: false
          tags: churnguard-mlflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build pipeline image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pipeline
          push: false
          tags: churnguard-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  config:
    name: Validate infra & workflow config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker compose
        run: docker compose config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint infra/helm/churnguard

      - name: Render Helm chart
        run: helm template churnguard infra/helm/churnguard --namespace churnguard > /dev/null

      - name: Terraform fmt & validate
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate -no-color

      - name: Validate Grafana dashboard JSON
        run: python -c "import json; json.load(open('configs/grafana/dashboards/churnguard.json'))"
