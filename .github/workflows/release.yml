name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [api, mlflow]
        include:
          - target: api
            image: churnguard-api
          - target: mlflow
            image: churnguard-mlflow
    steps:
      - uses: actions/checkout@v7

      # GHCR requires lowercase repository names; GitHub owners may have caps.
      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ECS (${{ github.event.inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ github.event.inputs.environment || 'prod' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote images from GHCR to ECR
        env:
          API_REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.PROJECT_NAME || 'churnguard' }}-prod-api
          MLFLOW_REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.PROJECT_NAME || 'churnguard' }}-prod-mlflow
          IMAGE_TAG: ${{ github.sha }}
          SOURCE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          docker pull "${SOURCE_PREFIX}/churnguard-api:sha-${IMAGE_TAG}"
          docker tag  "${SOURCE_PREFIX}/churnguard-api:sha-${IMAGE_TAG}" "${API_REPO}:${IMAGE_TAG}"
          docker push "${API_REPO}:${IMAGE_TAG}"

          docker pull "${SOURCE_PREFIX}/churnguard-mlflow:sha-${IMAGE_TAG}"
          docker tag  "${SOURCE_PREFIX}/churnguard-mlflow:sha-${IMAGE_TAG}" "${MLFLOW_REPO}:${IMAGE_TAG}"
          docker push "${MLFLOW_REPO}:${IMAGE_TAG}"

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_api_image_tag: ${{ github.sha }}
          TF_VAR_mlflow_image_tag: ${{ github.sha }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Smoke test the ALB endpoint
        run: |
          URL=$(terraform -chdir=infra/terraform output -raw alb_dns_name)
          for attempt in $(seq 1 10); do
            if curl -fsS "http://${URL}/health"; then
              echo "API is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "API failed to become healthy" >&2
          exit 1
