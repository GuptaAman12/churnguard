version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      ml-stack:
        patterns:
          - "mlflow*"
          - "scikit-learn*"
          - "xgboost*"
          - "optuna*"
          - "evidently*"
          - "pandera*"
      dev-tooling:
        patterns:
          - "ruff*"
          - "mypy*"
          - "pytest*"
          - "pre-commit*"
    # Evidently 0.7 constrains pandas<3; remove once it declares support.
    ignore:
      - dependency-name: "pandas"
        versions: [">=3"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One PR per week for all action bumps; each PR triggers a full CI run,
    # so serialising them keeps the queue short.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # The ML stack does not publish wheels for every new Python release.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
