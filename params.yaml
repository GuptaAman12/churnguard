data:
  url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv

split:
  test_size: 0.2
  seed: 42

training:
  n_trials: 25
  timeout_seconds: 300
  cv_folds: 5

promotion:
  min_roc_auc: 0.80
  tolerance: 0.005

serving:
  decision_threshold: 0.50

drift:
  share_threshold: 0.30
  sample_size: 2000
