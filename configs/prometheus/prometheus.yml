global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: churnguard

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: churnguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
